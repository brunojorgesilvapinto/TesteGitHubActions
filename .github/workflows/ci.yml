name: Minha primeira CI

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build da API
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependências
        run: dotnet restore TesteGithubActions/TesteGitHubActions.slnx

      - name: Compilar projeto
        run: dotnet build TesteGithubActions/TesteGitHubActions.slnx --no-restore

      